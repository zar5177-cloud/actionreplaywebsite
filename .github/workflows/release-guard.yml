name: Release guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  storefront-smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_ADMIN_API_VERSION: ${{ secrets.SHOPIFY_ADMIN_API_VERSION }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
      SHOPIFY_PRIVATE_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_PRIVATE_STOREFRONT_ACCESS_TOKEN }}
      SHOPIFY_GALAXY_TEE_VARIANT_BLACK_S: ${{ secrets.SHOPIFY_GALAXY_TEE_VARIANT_BLACK_S }}
      SHOPIFY_GALAXY_TEE_VARIANT_BLACK_M: ${{ secrets.SHOPIFY_GALAXY_TEE_VARIANT_BLACK_M }}
      SHOPIFY_GALAXY_TEE_VARIANT_BLACK_L: ${{ secrets.SHOPIFY_GALAXY_TEE_VARIANT_BLACK_L }}
      SHOPIFY_GALAXY_TEE_VARIANT_BLACK_XL: ${{ secrets.SHOPIFY_GALAXY_TEE_VARIANT_BLACK_XL }}
      SHOPIFY_GALAXY_TEE_VARIANT_BLACK_XXL: ${{ secrets.SHOPIFY_GALAXY_TEE_VARIANT_BLACK_XXL }}
      SHOPIFY_GALAXY_TEE_VARIANT_WHITE_S: ${{ secrets.SHOPIFY_GALAXY_TEE_VARIANT_WHITE_S }}
      SHOPIFY_GALAXY_TEE_VARIANT_WHITE_M: ${{ secrets.SHOPIFY_GALAXY_TEE_VARIANT_WHITE_M }}
      SHOPIFY_GALAXY_TEE_VARIANT_WHITE_L: ${{ secrets.SHOPIFY_GALAXY_TEE_VARIANT_WHITE_L }}
      SHOPIFY_GALAXY_TEE_VARIANT_WHITE_XL: ${{ secrets.SHOPIFY_GALAXY_TEE_VARIANT_WHITE_XL }}
      SHOPIFY_GALAXY_TEE_VARIANT_WHITE_XXL: ${{ secrets.SHOPIFY_GALAXY_TEE_VARIANT_WHITE_XXL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run release guard
        run: npm run release:check
