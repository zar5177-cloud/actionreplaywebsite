name: Live domain guard

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

jobs:
  live-domain-smoke:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        if: github.event_name != 'schedule'
        run: npx playwright install --with-deps chromium

      - name: Run live domain guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npm run live-domain:passive
          else
            npm run live-domain:check
          fi

      - name: Preserve checkout screenshot
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: live-shopify-checkout-pair
          path: test-results/live-shopify-checkout-pair.png
          if-no-files-found: ignore
